server {
    listen 80;
    server_name 10.8.100.239;

    # 1. React Frontend Build Files (located directly in /front)
    root /opt/dms/front;
    index index.html;

    # Handle React SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (JS, CSS, Images from build)
    location /assets/ {
        alias /opt/dms/front/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }


# Match both /static/ and /django-static/ for Django Admin / Jazzmin
    location /django-static/ {
        alias /opt/dms/staticfiles/;
        expires 30d;
    }

    location /static/ {
        alias /opt/dms/staticfiles/;
        expires 30d;
}


    # 3. Uploaded Documents / Media Files
    location /media/ {
        alias /opt/dms/media/;
    }

    # 4. Proxy Auth Endpoints to Gunicorn (Port 8000)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Proxy API Endpoints to Gunicorn (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Proxy Django Admin Portal to Gunicorn (Port 8000)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}